<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Private Settlers</title><link rel="stylesheet" href="/trading.css"><link rel="stylesheet" href="/game.css"></head><body>
<header class="topbar"><div><span class="eyebrow">YOUR PRIVATE TABLE</span><h1>Private Settlers</h1></div><div><p id="connection">Connecting…</p><button id="share" hidden>Copy room link</button></div></header>
<div id="lobby" class="panel"><h2>Gather your table</h2><p>Create a room for friends, or start with bots.</p><label>Name <input id="name" value="Nate" maxlength="24"></label><button id="create" disabled>Create room</button><label>Room code <input id="code" maxlength="6"></label><button id="join" disabled>Join room</button></div>
<div id="room-info"></div>
<main class="game-layout"><section class="table-area"><div class="turn-banner"><p id="turn" role="status"></p><p id="hint">Create a room, or enter your friend's room code.</p></div><div id="board"></div><section id="hand" hidden aria-label="Your resource hand"></section><details><summary>Renderer diagnostics</summary><pre id="status">Ready</pre><button id="probe">Run renderer probe</button></details></section><aside class="control-area"><h2>Play your turn</h2><div id="actions"></div><p id="error" role="alert"></p></aside></main>
<script src="/factories.js"></script><script src="/trading.js"></script><script src="/scoring.js"></script><script src="/development.js"></script><script src="/lab.js"></script></body></html>
