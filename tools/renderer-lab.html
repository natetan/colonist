<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Private Settlers</title>
<link rel="stylesheet" href="/trading.css">
<style>body{background:#142d3b;color:#eef5fa;font:16px system-ui;margin:24px}pre{white-space:pre-wrap}canvas{border:1px solid #7c99a5;max-width:100%;height:auto;display:block}button{padding:12px;margin:4px;cursor:pointer}input{padding:10px;margin:4px;max-width:130px}#error{color:#ffb8a6}#board{touch-action:none;position:relative;width:fit-content;max-width:100%}.placement{position:absolute;width:20px;height:20px;border:2px solid #132e3b;border-radius:50%;background:white;padding:0;margin:0;transform:translate(-50%,-50%)}.placement:hover,.placement:focus-visible{background:#efc96b;outline:2px solid white}label{display:inline-block}.harbor-label{position:absolute;transform:translate(-50%,-50%);padding:3px 5px;background:#102a38;border:1px solid #91b5c8;border-radius:5px;font-size:11px;white-space:nowrap;pointer-events:none}</style>
<style>.game-layout{display:grid;grid-template-columns:minmax(0,900px) minmax(260px,340px);gap:24px;max-width:1264px;align-items:start}.control-area{padding:16px;border:1px solid #526f7c;border-radius:12px;background:#183b4a}.control-area p:first-child{margin-top:0}.trade-controls table{width:100%}.trade-controls input{max-width:65px}.trade-controls h3{margin-top:0}@media(max-width:850px){.game-layout{grid-template-columns:1fr}.control-area{max-width:600px}}</style>
<style>body{margin:0;padding:24px;background:radial-gradient(ellipse at top,#23495a,#102632);max-width:1400px;margin-inline:auto}h1{margin:0;font-size:28px}button{border:1px solid #718f9b;border-radius:8px;background:#eac16b;color:#172c37;font-weight:650}button:disabled{opacity:.45;cursor:default}button:focus-visible,input:focus-visible{outline:3px solid #fff;outline-offset:2px}input{border:1px solid #718f9b;border-radius:6px;background:#102a38;color:#fff}#connection{font-size:13px;color:#a6dfca}#lobby{padding:20px;border:1px solid #526f7c;border-radius:12px;margin-block:20px}#room-info{line-height:1.8}#turn{font-weight:700;font-size:20px}#hint{color:#f1d392;line-height:1.5}#hand{line-height:1.8;background:#102a38;padding:12px;border-radius:8px}#status{font-size:12px;color:#abc3ce}#board canvas{border-radius:12px}.harbor-label{pointer-events:auto;cursor:help}.placement{box-shadow:0 0 0 2px #ffffff55}details{margin-top:20px;color:#abc3ce}#share{background:#23495a;color:white}@media(max-width:600px){body{padding:12px}h1{font-size:24px}.control-area{padding:12px}button{min-height:44px}}</style>
<h1>Private Settlers</h1><p>Your table. Your friends.</p>
<p id="connection">Connecting…</p>
<div id="lobby"><label>Name <input id="name" value="Nate" maxlength="24"></label><button id="create" disabled>Create room</button><label>Room code <input id="code" maxlength="6"></label><button id="join" disabled>Join room</button></div>
<p id="room-info"></p><button id="share" hidden>Copy room link</button>
<main class="game-layout"><section><div id="board"></div><details><summary>Renderer diagnostics</summary><pre id="status">Ready</pre><button id="probe">Run renderer probe</button></details></section><aside class="control-area"><p id="turn" role="status"></p><p id="hint">Create a room, or enter your friend's room code.</p><p id="hand" hidden></p><div id="actions"></div><p id="error" role="alert"></p></aside></main>
<style>.player-seats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:10px}.player-seat{padding:10px 14px;background:#183b4a;border:1px solid #526f7c;border-radius:8px}.player-seat strong,.player-seat span{display:block}.player-seat span{font-size:12px;color:#bdd0d8}.active-seat{border-color:#eac16b;box-shadow:inset 3px 0 #eac16b}</style>
<script src="/factories.js"></script><script src="/trading.js"></script><script src="/scoring.js"></script><script src="/development.js"></script><script src="/lab.js"></script></html>
