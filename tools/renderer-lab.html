<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Private Settlers</title><link rel="stylesheet" href="/trading.css"><link rel="stylesheet" href="/game.css"><link rel="stylesheet" href="/sprites.css"></head><body>
<nav class="utility-rail" aria-label="Table tools"><details><summary title="Settings">⚙</summary><label><input id="sound" type="checkbox"> Sound cues</label><p>No turn timeout is enforced.</p></details><button id="share" hidden title="Copy room link">↗</button><details><summary title="Connection and diagnostics">ⓘ</summary><p id="connection">Connecting…</p><pre id="status">Ready</pre><button id="probe">Run renderer probe</button></details></nav>
<div id="lobby" class="panel"><h1>Private Settlers</h1><p>Create a room for friends, or start with bots.</p><label>Name <input id="name" value="Nate" maxlength="24"></label><button id="create" disabled>Create room</button><label>Room code <input id="code" maxlength="6"></label><button id="join" disabled>Join room</button></div>
<main class="game-layout"><section class="table-area"><div id="board"></div><section class="bottom-bar" aria-label="Your hand and actions"><div id="dice"></div><div class="turn-banner"><span id="phase-clock" title="Elapsed time in this phase; no timeout" aria-label="Elapsed phase time">00:00</span><p id="turn" role="status"></p><p id="hint">Create a room, or enter your friend's room code.</p></div><section id="hand" hidden aria-label="Your resource hand"></section><aside class="control-area"><div id="actions"></div><p id="error" role="alert"></p></aside></section></section><aside class="game-sidebar"><section class="game-log parchment"><h2>Game log</h2><div id="events" role="log" aria-label="Public game events"><p>Welcome to your private table.</p></div></section><details class="chat-panel parchment"><summary>Chat</summary><div id="chat-messages" role="log" aria-label="Room chat"></div><form id="chat-form"><input id="chat-input" aria-label="Chat message" maxlength="300" placeholder="Message your table" required><button>Send</button></form></details><section id="bank" class="parchment" aria-label="Bank"></section><div id="room-info"></div><div id="score-panel" class="parchment"></div></aside></main>
<script src="/factories.js"></script><script src="/trading.js"></script><script src="/scoring.js"></script><script src="/development.js"></script><script src="/lab.js"></script></body></html>
