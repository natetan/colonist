<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Private Settlers</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body><header><span class="badge">LOCAL PROTOTYPE</span><h1>Private Settlers</h1><p>Your table. Your friends.</p><p id="connection" role="status">Connecting…</p></header>
<main><section class="panel"><div id="lobby"><h2>Gather your table</h2><label>Your name<input id="name" maxlength="24" autocomplete="nickname" placeholder="Nate"></label><button id="create" disabled>Create room</button><div class="divider">or join your friends</div><label>Room code<input id="code" maxlength="6" placeholder="ABC123"></label><button id="join" disabled>Join room</button></div><div id="room" hidden><h2>Room <span id="room-code"></span></h2><button id="copy">Copy room link</button><button id="bots" hidden>Start with bots</button><button id="start" hidden>Start game</button><button id="solo" hidden>Solo placement test</button><h3>Players</h3><ul id="players"></ul></div><p id="error" role="alert"></p></section><section class="board-panel"><h2>The island</h2><svg id="board" viewBox="-360 -330 720 660" aria-label="Shared island board" role="img"></svg><p id="resources"></p><p id="hint">Create or join a room to generate an island.</p><p class="note">Initial placement prototype. Dice, regular turns, trading, and scoring are still being built.</p></section></main></body></html>
